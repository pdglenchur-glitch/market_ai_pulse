# Single weekly cron: ingest -> trigger transform -> export -> publish
# Cadence history: weekly (Mondays) through Phase 5 -> daily on 2026-07-22 after
# a rate-limit review found no external API blocker -> back to weekly on
# 2026-09-01. Daily cadence (~30 job runs + ~30 SQL-warehouse spin-ups a month)
# repeatedly tripped Databricks Free Edition's serverless compute throttle -
# "Triggering new runs ... is currently disabled temporarily" on 2026-08-27, and
# a warehouse "Cannot create the resource" + throttle again on 2026-09-01. Weekly
# is ~4 of each a month, well inside Free Edition's tolerance, and the
# trailing-window fetches (see below) keep it gap-free at that cadence.
name: pipeline

on:
  workflow_dispatch: {}
  schedule:
    # Mondays 13:00 UTC (9am ET). The hour was moved from 06:00 to 13:00 on
    # 2026-08-19 for yfinance settlement buffer (a prior day's finalized close
    # can lag the 20:00 UTC market close by more than 10h); a Monday run also
    # has the whole weekend of settlement behind it. GitHub's scheduler often
    # fires this hours late - fine at weekly cadence, and every ingestion
    # source re-fetches a trailing window so a late or skipped run self-heals.
    - cron: "0 13 * * 1"

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Run ingestion (all sources -> R2 + Databricks volume)
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_ingestion.py
        working-directory: ingestion
      - name: Trigger Lakeflow transform job and wait for it to finish
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python trigger_and_poll_job.py
        working-directory: orchestration
      - name: Export gold tables to docs/data/*.json
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python export_gold_to_json.py
        working-directory: orchestration
      - name: Generate the pipeline run report
        if: always()
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pip install jupyter pandas
          jupyter nbconvert --to notebook --execute --inplace monitoring/pipeline_report.ipynb
      - name: Commit and push updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/*.json monitoring/pipeline_report.ipynb
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update dashboard data and pipeline run report"
          git push
      # Everything below is additive and only ever touches analysis/key_findings.ipynb
      # and analysis/key_findings_history.json. It only runs on a Monday - which every
      # scheduled run now is, so it refreshes once a week as intended; the gate still
      # matters for a mid-week workflow_dispatch, which should not touch the weekly
      # analysis. It doesn't gate, block, or modify the dashboard-facing steps above.
      - name: Check if today is Monday (weekly key-findings refresh day)
        id: day_check
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            echo "is_monday=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_monday=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for GitHub Pages to serve this week's data
        if: steps.day_check.outputs.is_monday == 'true'
        run: |
          expected=$(python -c "import json; print(json.load(open('docs/data/market_daily.json'))[-1]['date'])")
          echo "Waiting for Pages to serve latest market_daily date: $expected"
          for i in $(seq 1 20); do
            live=$(curl -fsS "https://pdglenchur-glitch.github.io/market_ai_pulse/data/market_daily.json" | python -c "import json,sys; print(json.load(sys.stdin)[-1]['date'])" 2>/dev/null || echo "")
            if [ "$live" = "$expected" ]; then
              echo "Pages is serving this week's data."
              break
            fi
            echo "Not yet (got '$live'), retrying in 15s..."
            sleep 15
          done
      - name: Refresh key findings notebook (weekly, analysis/ only)
        if: steps.day_check.outputs.is_monday == 'true'
        run: |
          pip install jupyter pandas numpy matplotlib requests
          jupyter nbconvert --to notebook --execute --inplace analysis/key_findings.ipynb
      - name: Regenerate README's Key findings bullets from the new snapshot
        if: steps.day_check.outputs.is_monday == 'true'
        run: python analysis/update_readme_key_findings.py
      - name: Commit and push refreshed key findings
        if: steps.day_check.outputs.is_monday == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/key_findings.ipynb analysis/key_findings_history.json README.md
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Refresh weekly key findings"
          git push
      - name: Open or update a failure alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label pipeline-failure --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Pipeline failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Pipeline failure: $(date -u +%Y-%m-%d)" \
              --label pipeline-failure \
              --body "The weekly pipeline failed and the dashboard may now be stale. See the run: $RUN_URL"
          fi
      - name: Close any open failure alert now that the pipeline recovered
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label pipeline-failure --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Pipeline succeeded on the next run — closing."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi
